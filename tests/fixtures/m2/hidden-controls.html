<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hidden controls</title></head>
<body>
<h1>Visibility</h1>
<button id="shown">Shown action</button>
<button id="d-none" style="display:none">Display none</button>
<button id="v-hidden" style="visibility:hidden">Visibility hidden</button>
<button id="op-zero" style="opacity:0">Opacity zero</button>
<button id="offscreen" style="position:absolute;left:-9999px">Offscreen</button>
<button id="zero-size" style="width:0;height:0;overflow:hidden;padding:0;border:0">Zero size</button>
<button id="attr-hidden" hidden>Hidden attr</button>
</body>
</html>
