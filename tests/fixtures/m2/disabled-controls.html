<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Disabled controls</title></head>
<body>
<h1>Settings</h1>
<button id="gone" disabled>Cannot click</button>
<label for="code">Code</label>
<input id="code" value="ABC" readonly>
<fieldset inert id="legacy">
  <legend>Legacy</legend>
  <button id="legacy-btn">Legacy action</button>
</fieldset>
<button id="fine">Works</button>
</body>
</html>
