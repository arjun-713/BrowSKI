<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Popup opener</title></head>
<body>
<h1>Opener</h1>
<button id="open">Open report</button>
<script>
  document.getElementById('open').addEventListener('click', () => {
    window.open('confirmation.html', '_blank');
  });
</script>
</body>
</html>
