<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Field definitions</title>
  </head>
  <body>
    <main>
      <h1>Field definitions</h1>
      <section aria-labelledby="field-record-heading">
        <h2 id="field-record-heading">Field record</h2>
        <dl>
          <dt>Retention period</dt><dd>7 years</dd>
          <dt>Destroy after</dt><dd>When the project closes</dd>
        </dl>
      </section>
      <section aria-labelledby="sample-record-heading">
        <h2 id="sample-record-heading">Sample record</h2>
        <dl>
          <dt>Retention period</dt><dd>18 months</dd>
          <dt>Destroy after</dt><dd>After the next audit</dd>
        </dl>
      </section>
    </main>
  </body>
</html>
