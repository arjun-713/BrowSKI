<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Northstar product details</title>
  </head>
  <body>
    <main>
      <h1 id="product-name">Northstar product</h1>
      <p id="memory"></p>
      <p id="storage"></p>
      <p id="price"></p>
      <button id="shortlist" type="button">Add this laptop to shortlist</button>
      <p id="result" role="status">Not added to shortlist.</p>
    </main>
    <script>
      const products = {
        "/product/studio-14": {
          name: "Northstar Studio 14",
          memory: "16 GB",
          storage: "512 GB",
          price: "$1,299",
        },
        "/product/studio-16": {
          name: "Northstar Studio 16",
          memory: "16 GB",
          storage: "1 TB",
          price: "$1,499",
        },
        "/product/travel-13": {
          name: "Northstar Travel 13",
          memory: "8 GB",
          storage: "512 GB",
          price: "$899",
        },
      };
      const product = products[location.pathname];
      document.querySelector("#product-name").textContent = product.name;
      document.querySelector("#memory").textContent = `Memory: ${product.memory}`;
      document.querySelector("#storage").textContent = `Storage: ${product.storage}`;
      document.querySelector("#price").textContent = `Price: ${product.price}`;
      document.querySelector("#shortlist").addEventListener("click", () => {
        localStorage.setItem("northstar-shortlist-item", product.name);
        document.querySelector("#result").textContent =
          `${product.name} added to shortlist.`;
      });
    </script>
  </body>
</html>
