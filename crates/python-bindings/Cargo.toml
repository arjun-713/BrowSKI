[package]
name = "browser-agent-python"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 interface exposing the stable high-level Rust browser API to Python"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
pyo3.workspace = true
browser-agent-core = { path = "../browser-core" }
browser-agent-cdp = { path = "../cdp" }
browser-agent-observation = { path = "../observation" }
