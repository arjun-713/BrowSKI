[agent]
orchestrator = "langgraph" # Legacy rollback only; new engines do not use the graph.
# Side-panel default (ADR-032): General/OpenAI in your own tabs. Each task uses
# paid OpenAI calls. Choose engine = "fast" for local Laya link navigation.
engine = "general"
fast_provider = "laya"
text_provider = "openai"
allow_paid_api = true
text_model = "gpt-6-luna"
laya_checkpoint = ".browser-data/laya-browser-v19s"
jev_endpoint = "https://api.typesafe.ai/v1/systemone"

[reasoning]
provider = "openai"
model = "gpt-6-luna"
enabled = true
effort = "low"

[decision]
provider = "laya"
mode = "shadow"
jev_enabled = false
laya_endpoint = "http://127.0.0.1:8001"
shadow_telemetry = true

# Trusted destinations for user-requested shopping sites. Only user task text
# can request these aliases; page content cannot add navigation destinations.
[navigation.site_aliases]
amazon = "https://www.amazon.in/"
flipkart = "https://www.flipkart.com/"
apple = "https://www.apple.com/in/shop/"

[privacy]
mode = "standard"

[safety]
confirm_high_risk_actions = true

[extension]
transport_mode = "native_host"
package_path = ""
native_host_manifest = ""

[traces]
level = "standard"

[vision]
enabled = false

[browser_code]
enabled = false

# Explicit local debugging only; files may contain task/page content after redaction.
[debug]
enabled = false
directory = "debug-logs"
max_session_bytes = 16777216
max_sessions = 100
retention_days = 30
